<div class="app-layout" [class.is-fullscreen]="isFullscreen()">
  <!-- Top Global Navigation Bar -->
  <header class="app-navbar">
    <div class="navbar-brand">
      <div class="brand-logo-badge">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-name">O MARCADOR</h1>
        <span class="brand-subtitle">Placar &amp; Cronómetro Desportivo</span>
      </div>
    </div>

    <div class="navbar-controls">
      <!-- Fullscreen Toggle Button -->
      <button 
        type="button" 
        class="nav-btn" 
        (click)="toggleFullscreen()" 
        [title]="isFullscreen() ? 'Sair do Ecrã Inteiro' : 'Modo Ecrã Inteiro'">
        @if (isFullscreen()) {
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
          </svg>
          <span class="btn-text">Sair Ecrã Inteiro</span>
        } @else {
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          <span class="btn-text">Ecrã Inteiro</span>
        }
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="app-main-content">
    <app-scoreboard></app-scoreboard>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <span class="footer-title">O Marcador — Scoreboard Web Application</span>
      <span class="footer-badge">Angular Standalone &amp; Signals</span>
    </div>
  </footer>
</div>
